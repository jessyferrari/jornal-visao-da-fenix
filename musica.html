<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Música · Jornal Visão da Fênix</title>
<style>body{margin:0;background:#0b0b0d;color:#eee;font:16px/1.45 system-ui,sans-serif}main{max-width:860px;margin:auto;padding:16px}
h1{font-size:22px;color:#d4af37;margin:8px 0}h2{font-size:19px;margin:28px 0 4px;color:#d4af37}h3{font-size:15px;margin:16px 0 6px;padding:4px 10px;background:#1b1b20;border-radius:6px;display:inline-block}
nav{position:sticky;top:0;background:#0b0b0dee;padding:8px 0;display:flex;gap:8px;flex-wrap:wrap;z-index:2}nav a{font-size:13px;padding:4px 10px;border:1px solid #333;border-radius:14px;font-weight:500}
.q{border-left:4px solid #ff6a00;background:#1a120c;padding:9px 12px;margin:7px 0;border-radius:6px}.i{padding:8px 0;border-bottom:1px solid #222}
a{color:#fff;text-decoration:none;font-weight:600}a:hover{text-decoration:underline}.m{color:#aaa;font-size:13px}.tag{color:#ff6a00;font-weight:700;font-size:12px;margin-right:6px}
.ok{color:#5fd38d}.esp{color:#e8c25a}.vz{color:#666;font-size:13px;padding:4px 0}.inc{color:#888;font-style:italic}.loc{font-size:12px;font-weight:700;color:#7fc8ff;letter-spacing:.2px;margin-bottom:2px}.loc.inc{color:#888}.alta{background:#101820;border:1px solid #1e3a50;border-radius:8px;padding:8px 12px;margin:6px 0}.alta b{color:#7fc8ff}.fire{color:#ff6a00;font-size:12px;font-weight:700}</style></head><body><main><h1>Música</h1>
<nav><a href="#alta">Mais falado</a><a href="#samba">Samba</a><a href="#pagode">Samba e Pagode</a><a href="#geral">Música, DJs e cultura</a></nav><div id="r" class="m">Carregando…</div></main>
<script>
const e=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const h=s=>{const d=s.publicado.slice(8,10)+'/'+s.publicado.slice(5,7)+' '+s.publicado.slice(11,16);
 const c=s.confirmado?'<span class="ok">confirmado em '+s.fontes+' fontes</span>':'<span class="esp">aguardando 2ª fonte</span>';
 const t=(s.tambemEm||[]).map(x=>'<a href="'+e(x.link)+'" rel="noopener" target="_blank">'+e(x.veiculo)+'</a>').join(', ');
 const lc=s.local||'';const ok=lc&&!/não identificada/.test(lc);return '<div class="loc'+(ok?'':' inc')+'" title="'+e(s.localComo||s.semCidadeMotivo||'')+'">📍 '+e(lc)+(s.brasileiroFora?' · 🇧🇷 brasileiro lá fora':'')+'</div>'+(s.emAlta?'<div class="fire">📈 em alta: '+e(s.emAlta.join(' · '))+'</div>':'')+'<a href="'+e(s.link)+'" rel="noopener" target="_blank">'+e(s.titulo)+'</a><div class="m">'+e(s.veiculo)+' · '+d+' (Brasília) · '+c+(t?' · também em '+t:'')+(s.categoria&&s.categoria!=='Música'?' · '+e(s.categoria):'')+'</div>';};
const bloco=(nome,b)=>'<h3>'+e(nome)+'</h3>'+(b.quentes.length||b.itens.length?b.quentes.map(s=>'<div class="q"><span class="tag">QUENTE</span>'+h(s)+'</div>').join('')+b.itens.slice(0,8).map(s=>'<div class="i">'+h(s)+'</div>').join(''):'<div class="vz">Nada novo nesta rodada.</div>');
const tend=(nome,l)=>'<h3>'+e(nome)+'</h3>'+(l&&l.length?l.map(t=>'<div class="alta"><b>'+e(t.termo)+'</b> <span class="m">'+e(t.fonte)+(t.trafego?' · '+e(t.trafego)+' buscas':'')+(t.horasEmAlta?' · em alta há '+t.horasEmAlta+' h, melhor posição '+t.melhorPosicao+'º':'')+'</span>'+(t.noticias||[]).map(n=>'<div class="m">↳ <a href="'+e(n.link)+'" rel="noopener" target="_blank">'+e(n.titulo)+'</a> · '+e(n.veiculo||'')+(n.local?' · 📍 '+e(n.local):'')+'</div>').join('')+'</div>').join(''):'<div class="vz">Nenhum assunto deste setor entre os mais falados do Brasil agora (Google Trends e X).</div>');
const NOMES={sp:'São Paulo',rj:'Rio de Janeiro',br:'Resto do Brasil',int:'Internacional'};
fetch('musica.json',{cache:'no-store'}).then(r=>r.json()).then(j=>{const S=j.setores;let o='<div class="m">Atualizado '+e(j.atualizado.replace('T',' '))+' (Brasília). Quente: ainda fora dos grandes portais.</div>';
 const M=j.maisFalado||{};o+='<h2 id="alta">Mais falado agora</h2><div class="m">Google Trends Brasil e assuntos do X no Brasil (trends24), cruzados com as notícias desta página.</div>'+tend('Samba',M.samba)+tend('Pagode',M.pagode)+tend('Música em geral',M.musica);
 o+='<h2 id="samba">1. Samba</h2>'+['sp','rj','br','int'].map(r=>bloco('Samba · '+NOMES[r],S.samba.regioes[r])).join('');
 o+='<h2 id="pagode">2. Samba e Pagode</h2>'+['sp','rj','br','int'].map(r=>bloco('Pagode · '+NOMES[r],S.sambaPagode.regioes[r])).join('');
 o+='<h2 id="geral">3. Música geral, DJs e cultura</h2>'+bloco('Brasil',{quentes:[],itens:S.geral.brasil})+bloco('Fora do Brasil',{quentes:[],itens:S.geral.fora});
 document.getElementById('r').outerHTML=o;}).catch(()=>{document.getElementById('r').textContent='Não consegui carregar a seção agora.';});
</script></body></html>
