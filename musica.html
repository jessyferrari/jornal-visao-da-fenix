<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Música · Jornal Visão da Fênix</title>
<style>body{margin:0;background:#0b0b0d;color:#eee;font:16px/1.45 system-ui,sans-serif}main{max-width:860px;margin:auto;padding:16px}
h1{font-size:22px;color:#d4af37;margin:8px 0}h2{font-size:18px;margin:26px 0 8px;border-bottom:1px solid #333;padding-bottom:6px}
.q{border-left:4px solid #ff6a00;background:#1a120c;padding:10px 12px;margin:8px 0;border-radius:6px}.i{padding:8px 0;border-bottom:1px solid #222}
a{color:#fff;text-decoration:none;font-weight:600}a:hover{text-decoration:underline}.m{color:#aaa;font-size:13px}.tag{color:#ff6a00;font-weight:700;font-size:12px;margin-right:6px}
.ok{color:#5fd38d}.esp{color:#e8c25a}</style></head><body><main><h1>Música</h1><div id="r" class="m">Carregando…</div></main>
<script>
const e=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const h=(s)=>{const d=s.publicado.slice(8,10)+'/'+s.publicado.slice(5,7)+' '+s.publicado.slice(11,16);
 const c=s.confirmado?'<span class="ok">confirmado em '+s.fontes+' fontes</span>':'<span class="esp">aguardando 2ª fonte</span>';
 const t=(s.tambemEm||[]).map(x=>'<a href="'+e(x.link)+'" rel="noopener" target="_blank">'+e(x.veiculo)+'</a>').join(', ');
 return '<a href="'+e(s.link)+'" rel="noopener" target="_blank">'+e(s.titulo)+'</a><div class="m">'+e(s.veiculo)+' · '+d+' (Brasília) · '+c+(t?' · também em '+t:'')+'</div>';};
fetch('musica.json',{cache:'no-store'}).then(r=>r.json()).then(j=>{const S=j.setores;let o='<div class="m">Atualizado '+e(j.atualizado.replace('T',' '))+' (Brasília)</div>';
 o+='<h2>1. Samba</h2><div class="m">Notícias Quentes: ainda fora dos grandes portais</div>'+S.samba.quentes.map(s=>'<div class="q"><span class="tag">QUENTE</span>'+h(s)+'</div>').join('');
 o+=S.samba.itens.filter(s=>!s.quente).slice(0,15).map(s=>'<div class="i">'+h(s)+'</div>').join('');
 o+='<h2>2. Samba e Pagode</h2><div class="m">O que mais está sendo falado</div>'+S.sambaPagode.maisFalado.map(s=>'<div class="i">'+(s.quente?'<span class="tag">QUENTE</span>':'')+h(s)+'</div>').join('');
 o+='<h2>3. Música geral</h2>'+S.geral.itens.map(s=>'<div class="i">'+h(s)+'</div>').join('');
 document.getElementById('r').outerHTML=o;}).catch(()=>{document.getElementById('r').textContent='Não consegui carregar a seção agora.';});
</script></body></html>
