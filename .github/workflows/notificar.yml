name: Robô do Jornal (edição + notificações)
on:
  schedule:
    # 17/11: edição a cada ~5 min (cron */5 + encadeamento abaixo). Rodadas de cron que chegam com outra na fila ficam esperando/canceladas pelo grupo (normal).
    - cron: '*/5 * * * *'
  workflow_dispatch:
permissions:
  contents: write
  pages: write
  actions: write
concurrency: { group: robo-jornal, cancel-in-progress: false }
jobs:
  robo:
    runs-on: ubuntu-latest
    timeout-minutes: 16
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: node scripts/robo.mjs
        env:
          NTFY_TOPIC: '${{ secrets.NTFY_TOPIC }}'
          NTFY_TOPIC_COMANDO: '${{ secrets.NTFY_TOPIC_COMANDO }}'
          NTFY_ASSINATURA: '${{ secrets.NTFY_ASSINATURA }}'
          FENIX_PAINEL_URL: '${{ secrets.FENIX_PAINEL_URL }}'
      - name: Música (samba, pagode, música, DJs e cultura) + notificações do canal Música
        run: timeout 480 node scripts/musica.mjs || echo "música falhou nesta rodada; a edição geral segue normal"
        env:
          NTFY_TOPIC_MUSICA: '${{ secrets.NTFY_TOPIC_MUSICA }}'
          NTFY_TOPIC_COMANDO: '${{ secrets.NTFY_TOPIC_COMANDO }}'
          NTFY_ASSINATURA: '${{ secrets.NTFY_ASSINATURA }}'
          FENIX_PAINEL_URL: '${{ secrets.FENIX_PAINEL_URL }}'
      - name: Séries e Filmes (streaming, 18 fontes públicas, regra das 2 fontes, ⭐ possível exclusivo) + canal Fenix Séries e Filmes
        run: timeout 300 node scripts/series.mjs || echo "Séries e Filmes falhou nesta rodada; o resto segue normal"
        env:
          NTFY_TOPIC_MUSICA: '${{ secrets.NTFY_TOPIC_MUSICA }}'
          NTFY_TOPIC_COMANDO: '${{ secrets.NTFY_TOPIC_COMANDO }}'
          NTFY_ASSINATURA: '${{ secrets.NTFY_ASSINATURA }}'
      - name: Esportes (todos os esportes, Brasil e mundo, 25 veículos públicos, regra das 2 fontes, Opinião/Crítica à parte, ⭐ possível exclusivo) + canal Fenix Esportes
        run: timeout 300 node scripts/esportes.mjs || echo "Esportes falhou nesta rodada; o resto segue normal"
        env:
          NTFY_TOPIC_MUSICA: '${{ secrets.NTFY_TOPIC_MUSICA }}'
          NTFY_TOPIC_COMANDO: '${{ secrets.NTFY_TOPIC_COMANDO }}'
          NTFY_ASSINATURA: '${{ secrets.NTFY_ASSINATURA }}'
      - name: Games (jogos, PlayStation, Xbox, Nintendo, PC, celular, eSports, lançamentos e trailers, Brasil e mundo, regra das 2 fontes, Opinião/Review à parte, ⭐ possível exclusivo) + canal Fenix Games
        run: timeout 300 node scripts/games.mjs || echo "Games falhou nesta rodada; o resto segue normal"
        env:
          NTFY_TOPIC_MUSICA: '${{ secrets.NTFY_TOPIC_MUSICA }}'
          NTFY_TOPIC_COMANDO: '${{ secrets.NTFY_TOPIC_COMANDO }}'
          NTFY_ASSINATURA: '${{ secrets.NTFY_ASSINATURA }}'
      - name: Arquivo de busca (14 dias, inclui as seções Música, Séries e Filmes, Esportes e Games)
        run: node scripts/busca-arquivo.mjs || echo "arquivo de busca falhou nesta rodada"
      - name: Em Alta (mais comentado no Brasil e no mundo, tendências subindo, curva de atenção e Agenda de postagens) + canal Fenix Em Alta
        run: timeout 150 node scripts/emalta.mjs || echo "Em Alta falhou nesta rodada; o resto segue normal"
        env:
          NTFY_TOPIC_MUSICA: '${{ secrets.NTFY_TOPIC_MUSICA }}'
          NTFY_TOPIC_COMANDO: '${{ secrets.NTFY_TOPIC_COMANDO }}'
          NTFY_ASSINATURA: '${{ secrets.NTFY_ASSINATURA }}'
      - name: Paradas por gênero (1 vez por hora; samba primeiro; só fontes públicas)
        run: |
          # 17/11: com rodadas a cada ~5 min, o portão é a idade de paradas.json (55+ min), não o minuto do relógio
          idade=$(node -e 'try{const g=require("./paradas.json").geradoEm;const t=Date.parse(/[zZ]|[+-]\d\d:\d\d$/.test(g)?g:g+":00-03:00");console.log(Math.round((Date.now()-t)/60e3))}catch{console.log(9999)}')
          if [ "$idade" -ge 55 ]; then PARADAS_LOOKUPS=40 timeout 270 node scripts/paradas.mjs || echo "paradas falharam nesta rodada; fica a anterior"; else echo "paradas: geradas há $idade min, só de novo com 55+ min"; fi
      - name: Referências (perfis sérios do Brasil e de fora, 1 vez a cada 30 min; só RSS oficial do YouTube e dos sites, sem raspagem)
        run: |
          idade=$(node -e 'try{const g=require("./referencias.json").atualizado;console.log(Math.round((Date.now()-Date.parse(g+":00-03:00"))/60e3))}catch{console.log(9999)}')
          if [ "$idade" -ge 28 ]; then timeout 120 node scripts/referencias.mjs || echo "referências falharam nesta rodada; fica a anterior"; else echo "referências: geradas há $idade min"; fi
      - name: Painel do dia (datas oficiais, o que vale postar por horário, exclusivos) + aviso das 7h e das 19h
        env:
          NTFY_TOPIC: '${{ secrets.NTFY_TOPIC }}'
        run: timeout 60 node scripts/hoje.mjs || echo "painel do dia falhou nesta rodada; fica o anterior"
      - name: Imagem de compartilhamento (og) da edição
        run: npm i --no-save --no-audit --no-fund playwright-core@1 >/dev/null && node scripts/og.mjs || echo "og falhou, mantém a anterior"
      - name: Status privado dos feeds (só no Actions)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: status-privado-feeds
          path: status-privado.md
          if-no-files-found: warn
          retention-days: 30
      - name: Publicar se mudou
        env: { GH_TOKEN: '${{ github.token }}' }
        run: |
          git config user.name "jornal-bot"; git config user.email "actions@users.noreply.github.com"
          # nunca publica status-privado.md no Pages
          git add edicao.json traducoes.json imagens.json porque-importa.json feed.xml sitemap.xml index.html app.js notificadas.json og.jpg og-quadrado.jpg og/estado.json sw.js musica.json musica-estado.json musica-locais.json musica-traducoes.json
          git add paradas.json paradas-generos.json 2>/dev/null || true
          git add emalta.json emalta-estado.json atencao.json emalta.html 2>/dev/null || true
          git add series.json series-estado.json series-traducoes.json series.html esportes.json esportes-estado.json esportes-traducoes.json esportes.html games.json games-estado.json games-traducoes.json games.html exclusivos-estado.json 2>/dev/null || true
          git add referencias.json referencias-estado.json 2>/dev/null || true
          git add hoje.json hoje-estado.json hoje.html 2>/dev/null || true
          git add -A busca 2>/dev/null || true
          if git diff --cached --quiet; then echo "sem mudança"; exit 0; fi
          git commit -q -m "Edição automática $(TZ=America/Sao_Paulo date '+%d/%m %H:%M') (Brasília)"
          # 14/11: antes um conflito no rebase (ex.: sw.js/traducoes.json mudados por outro commit) perdia a rodada em silêncio.
          # Agora, nos arquivos gerados, vale a versão desta rodada (-X theirs no rebase) e, se mesmo assim falhar, o passo falha visível.
          ok=0
          for i in 1 2 3; do
            if git pull --rebase -X theirs -q; then
              if git push -q; then ok=1; break; fi
            else
              git rebase --abort 2>/dev/null || true
            fi
            echo "publicação: tentativa $i falhou, tentando de novo"; sleep $((i*5))
          done
          if [ "$ok" != "1" ]; then echo "::error::edição não publicada nesta rodada (conflito ou push recusado)"; exit 1; fi
          gh api -X POST repos/${{ github.repository }}/pages/builds >/dev/null || echo "build do Pages será disparado pelo push"

  proxima:
    needs: robo
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with: { sparse-checkout: scripts }
      - name: Via rápida (fontes que mais publicam, a cada ~90 s) e agendar a próxima edição (~5 min)
        env: { GH_TOKEN: '${{ github.token }}' }
        run: |
          # espera até 180 s; se uma fonte rápida publicar antes, a próxima edição começa já. Não notifica nada daqui.
          VIA_RAPIDA_SEG=180 VIA_RAPIDA_VOLTA=90 timeout 260 node scripts/via-rapida.mjs || { echo "via rápida falhou, espera simples"; sleep 120; }
          outras=$(gh api "repos/${{ github.repository }}/actions/workflows/notificar.yml/runs?per_page=20" --jq '[.workflow_runs[] | select(.id != ${{ github.run_id }}) | select(.status=="queued" or .status=="in_progress" or .status=="waiting" or .status=="pending")] | length' || echo "ERR")
          if [ "$outras" != "0" ] && [ "$outras" != "ERR" ]; then echo "já há rodada na fila ($outras), não encadeia"; exit 0; fi
          ok=0
          for i in 1 2 3 4 5; do
            if gh workflow run notificar.yml --repo ${{ github.repository }} --ref main; then
              echo "próxima rodada agendada (tentativa $i)"
              ok=1
              break
            fi
            echo "falha ao agendar (tentativa $i), nova tentativa em $((i*20))s"
            sleep $((i*20))
          done
          if [ "$ok" != "1" ]; then echo "não foi possível agendar a próxima após 5 tentativas"; exit 1; fi
