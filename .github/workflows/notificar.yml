name: Robô do Jornal (edição + notificações)
on:
  schedule:
    - cron: '7,22,37,52 * * * *'
  workflow_dispatch:
permissions:
  contents: write
  pages: write
  actions: write
concurrency: { group: robo-jornal, cancel-in-progress: false }
jobs:
  robo:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: node scripts/robo.mjs
        env: { NTFY_TOPIC: '${{ secrets.NTFY_TOPIC }}' }
      - name: Imagem de compartilhamento (og) da edição
        run: npm i --no-save --no-audit --no-fund playwright-core@1 >/dev/null && node scripts/og.mjs || echo "og falhou, mantém a anterior"
      - name: Publicar se mudou
        env: { GH_TOKEN: '${{ github.token }}' }
        run: |
          git config user.name "jornal-bot"; git config user.email "actions@users.noreply.github.com"
          git add edicao.json traducoes.json imagens.json porque-importa.json feed.xml sitemap.xml index.html notificadas.json og.jpg og-quadrado.jpg og/estado.json
          if git diff --cached --quiet; then echo "sem mudança"; exit 0; fi
          git commit -q -m "Edição automática $(TZ=America/Sao_Paulo date '+%d/%m %H:%M') (Brasília)"
          git pull --rebase -q && git push -q
          gh api -X POST repos/${{ github.repository }}/pages/builds >/dev/null || echo "build do Pages será disparado pelo push"

  # Reserva: o agendamento (schedule) do GitHub pode atrasar ou nem disparar em repositório novo.
  # Cada rodada manual encadeia a próxima ~15 min depois, sem duplicar (só se não houver outra na fila).
  proxima:
    needs: robo
    if: always() && github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Agendar a próxima edição (~15 min)
        env: { GH_TOKEN: '${{ github.token }}' }
        run: |
          sleep 780
          outras=$(gh api "repos/${{ github.repository }}/actions/workflows/notificar.yml/runs?per_page=20" --jq '[.workflow_runs[] | select(.id != ${{ github.run_id }}) | select(.status=="queued" or .status=="in_progress" or .status=="waiting" or .status=="pending")] | length')
          if [ "$outras" != "0" ]; then echo "já há rodada na fila ($outras), não encadeia"; exit 0; fi
          gh workflow run notificar.yml --repo ${{ github.repository }} --ref main
