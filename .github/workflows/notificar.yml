name: Robô do Jornal (edição + notificações)
on:
  schedule:
    - cron: '7,22,37,52 * * * *'
  workflow_dispatch:
permissions:
  contents: write
  pages: write
  actions: write
concurrency: { group: robo-jornal, cancel-in-progress: false }
jobs:
  robo:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: node scripts/robo.mjs
        env:
          NTFY_TOPIC: '${{ secrets.NTFY_TOPIC }}'
          NTFY_TOPIC_COMANDO: '${{ secrets.NTFY_TOPIC_COMANDO }}'
          NTFY_ASSINATURA: '${{ secrets.NTFY_ASSINATURA }}'
          FENIX_PAINEL_URL: '${{ secrets.FENIX_PAINEL_URL }}'
      - name: Música (samba, pagode, música, DJs e cultura) + notificações do canal Música
        run: timeout 480 node scripts/musica.mjs || echo "música falhou nesta rodada; a edição geral segue normal"
        env:
          NTFY_TOPIC_MUSICA: '${{ secrets.NTFY_TOPIC_MUSICA }}'
          NTFY_TOPIC_COMANDO: '${{ secrets.NTFY_TOPIC_COMANDO }}'
          NTFY_ASSINATURA: '${{ secrets.NTFY_ASSINATURA }}'
          FENIX_PAINEL_URL: '${{ secrets.FENIX_PAINEL_URL }}'
      - name: Imagem de compartilhamento (og) da edição
        run: npm i --no-save --no-audit --no-fund playwright-core@1 >/dev/null && node scripts/og.mjs || echo "og falhou, mantém a anterior"
      - name: Status privado dos feeds (só no Actions)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: status-privado-feeds
          path: status-privado.md
          if-no-files-found: warn
          retention-days: 30
      - name: Publicar se mudou
        env: { GH_TOKEN: '${{ github.token }}' }
        run: |
          git config user.name "jornal-bot"; git config user.email "actions@users.noreply.github.com"
          # nunca publica status-privado.md no Pages
          git add edicao.json traducoes.json imagens.json porque-importa.json feed.xml sitemap.xml index.html app.js notificadas.json og.jpg og-quadrado.jpg og/estado.json sw.js musica.json musica-estado.json musica-locais.json musica-traducoes.json
          if git diff --cached --quiet; then echo "sem mudança"; exit 0; fi
          git commit -q -m "Edição automática $(TZ=America/Sao_Paulo date '+%d/%m %H:%M') (Brasília)"
          git pull --rebase -q && git push -q
          gh api -X POST repos/${{ github.repository }}/pages/builds >/dev/null || echo "build do Pages será disparado pelo push"

  proxima:
    needs: robo
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Agendar a próxima edição (~15 min)
        env: { GH_TOKEN: '${{ github.token }}' }
        run: |
          sleep 780
          outras=$(gh api "repos/${{ github.repository }}/actions/workflows/notificar.yml/runs?per_page=20" --jq '[.workflow_runs[] | select(.id != ${{ github.run_id }}) | select(.status=="queued" or .status=="in_progress" or .status=="waiting" or .status=="pending")] | length' || echo "ERR")
          if [ "$outras" != "0" ] && [ "$outras" != "ERR" ]; then echo "já há rodada na fila ($outras), não encadeia"; exit 0; fi
          ok=0
          for i in 1 2 3 4 5; do
            if gh workflow run notificar.yml --repo ${{ github.repository }} --ref main; then
              echo "próxima rodada agendada (tentativa $i)"
              ok=1
              break
            fi
            echo "falha ao agendar (tentativa $i), nova tentativa em $((i*20))s"
            sleep $((i*20))
          done
          if [ "$ok" != "1" ]; then echo "não foi possível agendar a próxima após 5 tentativas"; exit 1; fi
