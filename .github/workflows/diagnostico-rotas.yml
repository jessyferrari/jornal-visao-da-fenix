name: Diagnóstico de rotas públicas (só leitura, manual)
on:
  workflow_dispatch:
    inputs:
      modo: { description: "vazio = tudo; --instagram = só a rodada 2 do Instagram", required: false, default: "" }
permissions: { contents: read }
jobs:
  diag:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: if [ "$MODO" = "--instagram" ]; then node scripts/diagnostico-rotas.mjs --instagram; else node scripts/diagnostico-rotas.mjs; fi
        env: { MODO: '${{ inputs.modo }}' }
