name: Teste dos botões no ntfy (canal de teste)
on: { workflow_dispatch: {} }
permissions: { contents: read }
jobs:
  teste:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: node scripts/teste-ntfy-botoes.mjs
      - run: node scripts/teste-ntfy-agendado.mjs
      - run: node scripts/teste-robo-envio.mjs
      - run: node scripts/teste-robo-offline.mjs
      - run: node scripts/teste-hoje.mjs
      - run: node scripts/teste-formato.mjs
      - run: node scripts/teste-emalta-e2e.mjs
      - run: node scripts/teste-musica-e2e.mjs
      - run: node scripts/teste-disjuntor.mjs
      - run: node scripts/teste-lembrete-assinar.mjs
      - run: node scripts/teste-games.mjs
      - run: node scripts/teste-t328.mjs
      - run: node scripts/teste-perfis.mjs
      - run: node scripts/teste-busca-web.mjs
